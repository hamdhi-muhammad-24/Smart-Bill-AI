services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slt_ebill
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Colombo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      TZ: Asia/Colombo
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI to see sent emails
      - "1025:1025"   # SMTP
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/slt_ebill
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PDF_TOKEN_SECRET: ${PDF_TOKEN_SECRET:-change-me-in-production}
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: "SLT Billing <billing@slt.lk>"
      CORS_ORIGINS: '["http://localhost", "http://127.0.0.1", "http://206.189.159.175", "http://206.189.159.175:8080", "https://smartbills.sltdigitallab.lk"]'
      LOG_LEVEL: INFO
      RUN_IN_PROCESS_WORKER: "false"
      GMF_DRIVE_PATH: /app/gmf_uploads
      OUTPUT_DIR: /app/output
      QUEUE_INCOMING_DIR: /app/queue/incoming
      QUEUE_PENDING_DIR: /app/queue/pending
      SFTP_ENABLED: ${SFTP_ENABLED:-false}
      SFTP_HOST: ${SFTP_HOST:-127.0.0.1}
      SFTP_PORT: ${SFTP_PORT:-22}
      SFTP_USERNAME: ${SFTP_USERNAME:-root}
      SFTP_PASSWORD: ${SFTP_PASSWORD:-}
      SFTP_KEY_PATH: ${SFTP_KEY_PATH:-}
      SFTP_REMOTE_DIR: ${SFTP_REMOTE_DIR:-/var/slt-billing/mock_remote_slt}
      SFTP_POLL_INTERVAL_SECONDS: ${SFTP_POLL_INTERVAL_SECONDS:-1}
      TZ: Asia/Colombo
    ports:
      - "8000:8000"
    volumes:
      - /var/slt-billing/gmf_uploads:/app/gmf_uploads
      - /var/slt-billing/output_invoices:/app/output
      - slt_queue_data:/app/queue
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.scheduler.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/slt_ebill
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PDF_TOKEN_SECRET: ${PDF_TOKEN_SECRET:-change-me-in-production}
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: "SLT Billing <billing@slt.lk>"
      LOG_LEVEL: INFO
      GMF_DRIVE_PATH: /app/gmf_uploads
      OUTPUT_DIR: /app/output
      QUEUE_INCOMING_DIR: /app/queue/incoming
      QUEUE_PENDING_DIR: /app/queue/pending
      TZ: Asia/Colombo
    volumes:
      - /var/slt-billing/gmf_uploads:/app/gmf_uploads
      - /var/slt-billing/output_invoices:/app/output
      - slt_queue_data:/app/queue
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  billing-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.billing.worker_queue
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/slt_ebill
      LOG_LEVEL: INFO
      BILLING_WORKERS: ${BILLING_WORKERS:-2}
      GMF_DRIVE_PATH: /app/gmf_uploads
      OUTPUT_DIR: /app/output
      QUEUE_INCOMING_DIR: /app/queue/incoming
      QUEUE_PENDING_DIR: /app/queue/pending
      TZ: Asia/Colombo
    volumes:
      - /var/slt-billing/gmf_uploads:/app/gmf_uploads
      - /var/slt-billing/output_invoices:/app/output
      - slt_queue_data:/app/queue
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.scheduler.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/slt_ebill
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: INFO
      GMF_DRIVE_PATH: /app/gmf_uploads
      QUEUE_INCOMING_DIR: /app/queue/incoming
      QUEUE_PENDING_DIR: /app/queue/pending
      TZ: Asia/Colombo
    volumes:
      - /var/slt-billing/gmf_uploads:/app/gmf_uploads
      - slt_queue_data:/app/queue
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://smartbills.sltdigitallab.lk
        VITE_AZURE_CLIENT_ID: 0d42d2c9-48a3-4924-980e-68c613f6737b
        VITE_AZURE_TENANT_ID: 534253fc-dfb6-462f-b5ca-cbe81939f5ee
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

